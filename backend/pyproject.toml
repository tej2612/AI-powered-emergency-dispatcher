[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emergency-response-backend"
version = "0.1.0"
description = "AI-powered Emergency Response FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # ML / AI
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "sentence-transformers>=2.2.2",
    "accelerate>=0.24.0",
    "bitsandbytes>=0.41.0",
    "sentencepiece>=0.1.99",
    # Vector DB
    "chromadb>=0.4.0",
    # Image
    "pillow>=10.0.0",
    # Data
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    # Big-data ingestion (optional — only needed for ingestion scripts)
    "pyspark>=3.5.0",
    "pyarrow>=14.0.0",
    # External APIs
    "tavily-python>=0.3.0",
    "google-generativeai>=0.3.0",
]

[tool.uv]
dev-dependencies = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
